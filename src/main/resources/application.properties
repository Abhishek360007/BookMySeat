spring.application.name=BookMySeat

# Database / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Lazy collections (e.g. booking seats) load in one IN (...) query instead of one per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100

# Logs: every line carries the request id, e.g. "[3f2a...]" (empty brackets are dropped outside requests)
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ',''}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: health and info are public; details and metrics need ADMIN (see SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true

# Errors
server.error.include-stacktrace=never
server.error.include-message=never

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
# Short-lived access tokens; clients renew them with POST /api/auth/refresh
jwt.expiration-minutes=15
jwt.refresh-expiration-days=7
jwt.issuer=bookmyseat

# Admin account created on startup (set via environment variables, never commit real values)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Booking
booking.hold-minutes=5
booking.cancel-cutoff-minutes=120

# Background cleanup of expired refresh tokens. Render sleeps when idle, so this runs a few minutes
# after each wake-up and then every 6 hours, instead of at a fixed time the app might sleep through.
cleanup.refresh-tokens.initial-delay=PT5M
cleanup.refresh-tokens.interval=PT6H

# Fail fast when Redis is unreachable (default is 60 s), so the rate limiter can fail open quickly
spring.data.redis.timeout=2s

# Rate limits per client IP (fixed window, stored in Redis)
rate-limit.login.max-requests=5
rate-limit.login.window-seconds=60
rate-limit.register.max-requests=5
rate-limit.register.window-seconds=3600
