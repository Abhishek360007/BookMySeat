spring.application.name=BookMySeat

# Database / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Lazy collections (e.g. booking seats) load in one IN (...) query instead of one per row
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.data.web.pageable.max-page-size=100

# Logs: every line carries the request id and the trace id, e.g. "[3f2a...] [trace 4bf9...]"
# (empty brackets are dropped: outside requests, or when a line isn't part of a trace)
logging.pattern.correlation=%replace([%X{requestId}] ){'\\[\\] ',''}%replace([trace %X{traceId}] ){'\\[trace \\] ',''}

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: health and info are public; details and metrics need ADMIN (see SecurityConfig)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true

# Metrics (pushed once a minute) and traces over OTLP, off unless OTLP_ENABLED=true. Production: Grafana Cloud.
# Locally: docker compose --profile monitoring up -d lgtm, then Grafana at http://localhost:13000
management.otlp.metrics.export.enabled=${OTLP_ENABLED:false}
# Only the OTLP_* settings here decide where telemetry goes. Without this, standard OTEL_* variables in the
# environment take over: Render's Docker builder sets OTEL_EXPORTER_OTLP_ENDPOINT=unix:///dev/otel-grpc.sock,
# which made the CDS training run (and so the deploy) fail.
management.opentelemetry.map-environment-variables=false
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:14318}/v1/metrics
management.otlp.metrics.export.compression-mode=gzip
management.opentelemetry.resource-attributes[deployment.environment.name]=local
management.tracing.export.otlp.enabled=${OTLP_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:14318}/v1/traces
management.opentelemetry.tracing.export.otlp.compression=gzip
# Traffic is low: keep every trace (health probes make none, see ObservationConfig)
management.tracing.sampling.probability=1.0
# Database spans (datasource-micrometer): connections and queries, not one span per result set read.
# SQL is recorded with ? placeholders: parameter values (emails, tokens) never reach the traces.
jdbc.includes=CONNECTION,QUERY
jdbc.datasource-proxy.include-parameter-values=false
# Request latency as a few fixed buckets (enough for p95 and "share under 500 ms"), not ~70 per URL
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s,5s

# Errors
server.error.include-stacktrace=never
server.error.include-message=never

# JWT
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
# Short-lived access tokens; clients renew them with POST /api/auth/refresh
jwt.expiration-minutes=15
jwt.refresh-expiration-days=7
jwt.issuer=bookmyseat

# Admin account created on startup (set via environment variables, never commit real values)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Email verification links (optional verification: nothing is blocked for unverified accounts)
auth.email-verification.link-lifetime=PT24H
# Password reset links: short-lived, because whoever holds one can take over the account
auth.password-reset.link-lifetime=PT1H

# E-tickets: the key that signs ticket codes. Empty = derived from jwt.secret (no extra variable to set).
# Changing it invalidates every ticket already issued.
tickets.secret=${TICKET_SECRET:}
# Doors: tickets can be checked in from 6 hours before a show until 6 hours after it starts
tickets.check-in.opens-before=PT6H
tickets.check-in.closes-after=PT6H

# Booking
booking.hold-minutes=5
booking.cancel-cutoff-minutes=120

# Background cleanup of expired refresh tokens. Render sleeps when idle, so this runs a few minutes
# after each wake-up and then every 6 hours, instead of at a fixed time the app might sleep through.
cleanup.refresh-tokens.initial-delay=PT5M
cleanup.refresh-tokens.interval=PT6H

# Fail fast when Redis is unreachable (default is 60 s), so the rate limiter can fail open quickly
spring.data.redis.timeout=2s

# Online payments (Razorpay). Off by default: bookings are confirmed directly, as before.
# When on, a booking is only created after a successful payment (checkout -> pay -> verify/webhook).
payments.enabled=${PAYMENTS_ENABLED:false}
payments.window=PT15M
payments.currency=INR
payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
payments.razorpay.base-url=https://api.razorpay.com/v1
# Expires unpaid checkouts and retries failed refunds
payments.maintenance.initial-delay=PT2M
payments.maintenance.interval=PT1M

# Emails. provider: log (only written to the log), smtp (spring.mail.*, e.g. Mailpit from compose.yaml)
# or brevo (Brevo's HTTP API; Render's free tier blocks outgoing SMTP)
email.provider=${EMAIL_PROVIDER:log}
email.from=${EMAIL_FROM:no-reply@bookmyseat.dev}
email.from-name=BookMySeat
email.public-url=${APP_PUBLIC_URL:http://localhost:8080}
email.time-zone=Asia/Kolkata
# The public demo account (scripts/seed-demo.ps1): its inbox belongs to nobody, so never send to it,
# and its password (published on the site) can't be changed or reset by a visitor
app.demo.email=demo@bookmyseat.dev
email.suppressed-recipients=${app.demo.email}
email.brevo.api-key=${BREVO_API_KEY:}
email.brevo.base-url=https://api.brevo.com/v3
spring.mail.host=localhost
spring.mail.port=11025
# Outbox: emails are stored with the change that caused them, then delivered (and retried) by a job
email.outbox.send-immediately=true
email.outbox.max-attempts=8
email.outbox.first-retry-delay=PT30S
email.outbox.keep-sent=P7D
email.outbox.initial-delay=PT30S
email.outbox.interval=PT1M

# Rate limits per client IP (fixed window, stored in Redis)
rate-limit.login.max-requests=5
rate-limit.login.window-seconds=60
rate-limit.register.max-requests=5
rate-limit.register.window-seconds=3600
rate-limit.verification-email.max-requests=3
rate-limit.verification-email.window-seconds=3600
rate-limit.forgot-password.max-requests=3
rate-limit.forgot-password.window-seconds=3600
rate-limit.change-password.max-requests=5
rate-limit.change-password.window-seconds=900
