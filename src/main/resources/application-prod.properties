# Production profile (SPRING_PROFILES_ACTIVE=prod). Every value comes from environment variables,
# so the repo holds no secrets. JWT_SECRET, ADMIN_EMAIL and ADMIN_PASSWORD are read in application.properties.

# Render sets PORT; its proxy terminates HTTPS, so trust X-Forwarded-* (Swagger "Try it out" then uses https)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Small pool: plenty for one tiny instance, and well under Neon's free connection limit
spring.datasource.hikari.maximum-pool-size=5

spring.data.redis.url=${REDIS_URL}

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
# One JSON object per log line (Elastic Common Schema); MDC values such as requestId become searchable fields
logging.structured.format.console=ecs
