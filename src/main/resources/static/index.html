<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BookMySeat</title>
	<meta name="description" content="Book movie seats: live seat map, 5-minute holds, no double bookings.">
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="/assets/app.css">
	<script type="module" src="/assets/app.js"></script>
</head>
<body>
	<header class="topbar">
		<a class="brand" href="#/">
			<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v2a2 2 0 0 0 0 4v2a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-2a2 2 0 0 0 0-4z"/></svg>
			<span>BookMySeat</span>
		</a>
		<nav class="nav">
			<a href="#/">Shows</a>
			<a href="#/bookings" data-auth-only hidden>My bookings</a>
			<span class="who" data-auth-only hidden></span>
			<button class="btn btn-ghost" id="login-btn" type="button">Log in</button>
			<button class="btn btn-ghost" id="logout-btn" type="button" data-auth-only hidden>Log out</button>
		</nav>
	</header>

	<main id="app" class="container" aria-live="polite">
		<p class="muted">Loading…</p>
	</main>

	<footer class="footer container">
		<span>Demo project · seats are held for a few minutes, then released</span>
		<a href="/swagger-ui/index.html">API docs</a>
		<a href="https://github.com/Abhishek360007/BookMySeat">Source</a>
	</footer>

	<dialog id="auth-dialog" aria-labelledby="auth-title">
		<form method="dialog" class="auth-form" id="auth-form" novalidate>
			<h2 id="auth-title">Log in</h2>
			<label data-register-only hidden>Name <input name="name" autocomplete="name" maxlength="100"></label>
			<label>Email <input name="email" type="email" autocomplete="email" required></label>
			<label>Password <input name="password" type="password" autocomplete="current-password" required minlength="8"></label>
			<p class="form-error" id="auth-error" role="alert" hidden></p>
			<div class="row">
				<button class="btn btn-primary" type="submit" id="auth-submit">Log in</button>
				<button class="btn btn-ghost" type="button" id="auth-cancel">Cancel</button>
			</div>
			<p class="muted small">
				<button class="link" type="button" id="auth-toggle">No account? Register</button>
				· <button class="link" type="button" id="auth-demo">Use the demo account</button>
			</p>
		</form>
	</dialog>

	<div id="toasts" class="toasts" aria-live="assertive"></div>
</body>
</html>
