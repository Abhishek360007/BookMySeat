name: CodeQL

# Static security analysis of the Java backend and the web app's JavaScript (SQL injection, XSS, path
# traversal, unsafe deserialisation...). Findings appear under the repository's Security > Code scanning tab.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1' # weekly, so new queries also check code that hasn't changed

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none # analyses the sources directly, no Maven build needed
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
