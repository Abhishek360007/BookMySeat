name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository (the deploy hook is a secret URL, not a GitHub token)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Runs unit tests and the Testcontainers tests (Ubuntu runners have Docker)
      - name: Build and test
        run: ./mvnw -B verify
      # Alert rules: valid, and each fires (or stays quiet) as the unit tests expect; the dashboard is valid JSON
      - name: Check monitoring files
        run: |
          docker run --rm -v "$PWD/monitoring:/rules" -w /rules --entrypoint promtool prom/prometheus:v3.15.1 \
            test rules alerts.test.yaml
          python3 -m json.tool monitoring/bookmyseat-dashboard.json > /dev/null
      # Coverage table on the run's summary page, plus the full HTML report as a downloadable artifact
      - name: Coverage summary
        run: python3 .github/scripts/coverage_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
      # A broken Dockerfile fails the build too
      - name: Build Docker image
        run: docker build -t bookmyseat:ci .
      # Render's builder sets OTEL_* variables pointing at a Unix socket; the app must still start with them
      # (they once broke the deploy). Same start as the Dockerfile's CDS training run.
      - name: Start with Render's OTEL_* variables
        run: |
          docker run --rm -e OTEL_EXPORTER_OTLP_ENDPOINT=unix:///dev/otel-grpc.sock -e OTEL_EXPORTER_OTLP_PROTOCOL=grpc \
            --entrypoint java bookmyseat:ci -Dspring.context.exit=onRefresh \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/cds-training -Dspring.flyway.enabled=false \
            -Dspring.jpa.hibernate.ddl-auto=none -Dspring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false \
            -Dspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect -jar app.jar
      # Continuous deployment: only after everything above is green, and only for pushes to main.
      # Skipped (not failed) when the RENDER_DEPLOY_HOOK_URL secret isn't set, e.g. on forks.
      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set, skipping deploy"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy triggered"
