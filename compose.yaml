services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
    # Named volume: removing containers (e.g. "docker compose down") keeps the data.
    # Postgres 18 keeps data under /var/lib/postgresql (not .../data as in older images)
    volumes:
      - pgdata:/var/lib/postgresql
  redis:
    image: 'redis:8'
    ports:
      - '6379'
  # Fake mail server for development: catches every email (SMTP on 1025), inbox at http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:v1.27'
    ports:
      - '1025:1025'
      - '8025:8025'
  # Only started with: docker compose --profile app up -d --build
  # (plain "docker compose up" and Spring's Docker Compose support start just the databases)
  app:
    build: .
    profiles: ["app"]
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DATA_REDIS_HOST: redis
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_PROVIDER: smtp
      SPRING_MAIL_HOST: mailpit
    depends_on:
      - postgres
      - redis
      - mailpit

volumes:
  pgdata:
